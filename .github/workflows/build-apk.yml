name: Build & Publish Prebuilt APKs (Manual & Full)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish Manual & Full Debug APKs to GitHub Releases"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-editions:
    name: Test, Build & Verify Manual + Full Editions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore optional Firebase configuration from secrets
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from repository secret."
          else
            echo "GOOGLE_SERVICES_JSON_B64 not set; building Offline-ready APKs (MissingGoogleServicesStrategy.WARN)."
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Manual Edition unit and Robolectric tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testManualDebugUnitTest --stacktrace
          else
            gradle :app:testManualDebugUnitTest --stacktrace
          fi

      - name: Run Full Edition unit and Robolectric tests
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:testFullDebugUnitTest --stacktrace
          else
            gradle :app:testFullDebugUnitTest --stacktrace
          fi

      - name: Build Manual Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleManualDebug --stacktrace
          else
            gradle :app:assembleManualDebug --stacktrace
          fi
          mkdir -p dist/manual
          cp app/build/outputs/apk/manual/debug/EterScreen-Translator-manual-debug.apk dist/manual/
          (cd dist/manual && sha256sum EterScreen-Translator-manual-debug.apk > EterScreen-Translator-manual-debug.apk.sha256)
          ls -lh dist/manual/EterScreen-Translator-manual-debug.apk

      - name: Build Full Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleFullDebug --stacktrace
          else
            gradle :app:assembleFullDebug --stacktrace
          fi
          mkdir -p dist/full
          cp app/build/outputs/apk/full/debug/EterScreen-Translator-full-debug.apk dist/full/
          (cd dist/full && sha256sum EterScreen-Translator-full-debug.apk > EterScreen-Translator-full-debug.apk.sha256)
          ls -lh dist/full/EterScreen-Translator-full-debug.apk

      - name: Verify merged manifests and packaged APKs (Manual vs Full)
        run: python3 scripts/verify_flavor_manifests.py

      - name: Clean up sensitive transient build files
        if: always()
        run: rm -f app/google-services.json my-upload-key.jks

      - name: Upload Manual Edition test report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-manual
          path: app/build/reports/tests/testManualDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Full Edition test report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report-full
          path: app/build/reports/tests/testFullDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Manual Edition Debug APK (Primary Testing Download)
        uses: actions/upload-artifact@v7
        with:
          name: EterScreen-Translator-manual-debug
          path: dist/manual/*
          retention-days: 30

      - name: Upload Full Edition Debug APK (Includes Accessibility Auto-Scroll)
        uses: actions/upload-artifact@v7
        with:
          name: EterScreen-Translator-full-debug
          path: dist/full/*
          retention-days: 30

      - name: Publish Manual & Full Debug APKs to GitHub Releases
        if: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest-editions-debug' }}"
          target_commitish: "${{ github.sha }}"
          name: "${{ startsWith(github.ref, 'refs/tags/') && format('EterScreen Translator {0}', github.ref_name) || format('EterScreen Translator (Manual + Full Debug Build #{0})', github.run_number) }}"
          body: |
            Automated build from `${{ github.ref_name }}` (`${{ github.sha }}`, workflow run `#${{ github.run_number }}`).

            - **Manual Edition (`EterScreen-Translator-manual-debug.apk`)**: `com.eteroverseer.screentranslator` — no Accessibility Service declaration in manifest.
            - **Full Edition (`EterScreen-Translator-full-debug.apk`)**: `com.eteroverseer.screentranslator.full` — includes `AutoScrollAccessibilityService`.
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/manual/EterScreen-Translator-manual-debug.apk
            dist/manual/EterScreen-Translator-manual-debug.apk.sha256
            dist/full/EterScreen-Translator-full-debug.apk
            dist/full/EterScreen-Translator-full-debug.apk.sha256
